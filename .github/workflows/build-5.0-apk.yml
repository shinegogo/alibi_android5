name: Build 5.0-compatible APK

on:
  workflow_dispatch:   # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. 设置 JDK 17（AGP 8 需要）
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    # 2. 改 minSdk 21
    - name: Patch minSdk
      run: |
        sed -i 's/minSdk.*/minSdk = 21/' app/build.gradle.kts

    # 3. 编译 Release APK
    - name: Build APK
      run: ./gradlew assembleRelease

    # 4. 把 apk 当 artifact 上传，90 天内可下载
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: alibi-5.0-release
        path: app/build/outputs/apk/release/*.apk
