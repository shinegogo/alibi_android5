name: Build 5.0-compatible APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    # 1. 改 minSdkVersion
    - name: Patch minSdk
      run: |
        sed -i 's/minSdkVersion.*/minSdkVersion 21/' app/build.gradle

    # 2. 把缺失的仓库写进 build.gradle（root 级）
    - name: Add missing repositories
      run: |
        sed -i '/repositories {/a\
        maven { url "https://jitpack.io" }\
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }' build.gradle

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: alibi-5.0-release
        path: app/build/outputs/apk/release/*.apk
